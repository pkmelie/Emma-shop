<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable — Em'shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cream:      #FAF7F0;
      --gold:       #C9A84C;
      --gold-light: #E8D5A0;
      --dark:       #1A1612;
      --dark2:      #2D2419;
      --muted:      #9B8C72;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:    'Josefin Sans', sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font-body);
      background: var(--dark);
      color: var(--cream);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
      overflow: hidden;
    }

    /* Suits flottants en arrière-plan */
    .bg-suits {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .bg-suits span {
      position: absolute;
      font-size: clamp(4rem, 12vw, 9rem);
      opacity: .04;
      animation: float 18s ease-in-out infinite;
      user-select: none;
    }
    .bg-suits span:nth-child(1) { top: 5%;  left: 8%;  animation-delay: 0s;   animation-duration: 20s; }
    .bg-suits span:nth-child(2) { top: 15%; right: 6%; animation-delay: -5s;  animation-duration: 17s; }
    .bg-suits span:nth-child(3) { bottom: 12%; left: 12%; animation-delay: -9s;  animation-duration: 22s; }
    .bg-suits span:nth-child(4) { bottom: 8%;  right: 9%; animation-delay: -3s;  animation-duration: 19s; }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50%       { transform: translateY(-22px) rotate(4deg); }
    }

    /* Contenu principal */
    .card-404 {
      position: relative;
      z-index: 1;
      border: 1px solid rgba(201,168,76,.2);
      border-radius: 6px;
      padding: clamp(2.5rem, 6vw, 4.5rem) clamp(2rem, 8vw, 5rem);
      background: rgba(255,255,255,.03);
      backdrop-filter: blur(4px);
      max-width: 520px;
      width: 100%;
      animation: fadeUp .6s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .suits-row {
      font-size: 1.4rem;
      letter-spacing: .9rem;
      margin-bottom: 2rem;
      opacity: .35;
    }

    .code-404 {
      font-family: var(--font-display);
      font-size: clamp(5rem, 16vw, 8rem);
      font-weight: 300;
      line-height: 1;
      color: var(--gold);
      letter-spacing: .05em;
      margin-bottom: .3rem;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      font-weight: 400;
      color: var(--gold-light);
      letter-spacing: 2px;
      margin-bottom: 1.2rem;
    }

    .message {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.8;
      letter-spacing: .5px;
      margin-bottom: 2.5rem;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--gold);
      opacity: .3;
      margin: 0 auto 2.5rem;
    }

    .btn-home {
      display: inline-block;
      font-family: var(--font-body);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--dark);
      background: var(--gold);
      padding: .85rem 2.2rem;
      border-radius: 3px;
      transition: background .2s, transform .15s;
    }
    .btn-home:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
    }

    .footer-hint {
      margin-top: 2rem;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
      opacity: .6;
    }
  </style>
</head>
<body>

  <div class="bg-suits" aria-hidden="true">
    <span>♠</span><span>♥</span><span>♦</span><span>♣</span>
  </div>

  <div class="card-404">
    <div class="suits-row" aria-hidden="true">♠ ♥ ♦ ♣</div>

    <p class="code-404">404</p>
    <h1>Page introuvable</h1>

    <p class="message">
      Cette page n'existe pas ou a été déplacée.<br>
      Vérifiez l'adresse saisie ou retournez à la boutique.
    </p>

    <div class="divider"></div>

    <a href="/" class="btn-home">Retour à la boutique</a>

    <p class="footer-hint">___ Em'shop ___</p>
  </div>

</body>
</html>
